[project]
name = "lsio-triage"
version = "0.1.0"
description = "First responses to new issues and pull requests in the LinuxServer.io v2 playground, written by Claude from the hub's data."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "anthropic==2.3.0",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "pyjwt==2.15.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["triage"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
