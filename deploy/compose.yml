---
# Run from the directory that holds this file, .env and config/: `docker compose up -d`.
services:
  triage:
    image: ghcr.io/linuxserver-playground/triage:latest
    container_name: triage
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    # holds ANTHROPIC_API_KEY and TRIAGE_APP_ID (plus any TRIAGE_* override); mode 600, never committed
    env_file: ./.env
    volumes:
      # app.pem (the App's private key), triage.db and the clones of the hub's data and the site's docs
      - ./config:/config
    # no ports and no shared network: the bot only makes outgoing requests (control's public API, GitHub, Anthropic)

  updater:
    # The deploy: every 5 minutes pull triage's :latest (published by every push to main) and recreate the
    # container only when the digest changed. Nobody needs to log in to ship a change.
    image: docker:29-cli
    container_name: triage-updater
    restart: unless-stopped
    # compose resolves ./config and ./.env as host paths, so the directory is mounted, and worked in, at the
    # same path as on the host
    working_dir: ${PWD}
    command:
      - sh
      - -c
      - |
        while true; do
          docker compose -p triage pull -q triage &&
            docker compose -p triage up -d triage
          sleep 300
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}:ro
