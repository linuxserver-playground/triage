---
services:
  triage:
    image: ghcr.io/linuxserver-playground/triage:latest
    container_name: triage
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    # holds ANTHROPIC_API_KEY and TRIAGE_APP_ID (plus any TRIAGE_* override); mode 600, never committed
    env_file: /home/thelamer/triage/.env
    volumes:
      # app.pem (the App's private key), triage.db and the clones of the hub's data and the site's docs
      - /home/thelamer/triage/config:/config
    # no ports and no shared network: the bot only makes outgoing requests (control's public API, GitHub, Anthropic)

  updater:
    # The deploy: every 5 minutes pull triage's :latest (published by every push to main) and recreate the
    # container only when the digest changed. Nobody needs to ssh in to ship a change.
    image: docker:29-cli
    container_name: triage-updater
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        while true; do
          docker compose -p triage -f /home/thelamer/triage/compose.yml pull -q triage &&
            docker compose -p triage -f /home/thelamer/triage/compose.yml up -d triage
          sleep 300
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # compose reads compose.yml and .env from the host paths, so mount them at the same place
      - /home/thelamer/triage:/home/thelamer/triage:ro
